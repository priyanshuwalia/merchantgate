<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">MerchantGate</title>
  <desc id="desc">A gate formed by two pillars framing a passage, symbolizing the gateway between AI agents and commerce.</desc>
  <defs>
    <linearGradient id="mg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="55%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#00338d"/>
    </linearGradient>
  </defs>
  <g fill="url(#mg-grad)">
    <!-- Left pillar (tall) -->
    <rect x="5" y="5" width="7" height="38" rx="2"/>
    <!-- Overhead beam spanning full width, connecting both pillars -->
    <path d="M5 5h38a0 0 0 0 1 0 0v7a0 0 0 0 1 0 0H5a0 0 0 0 1 0 0V5a0 0 0 0 1 0 0z"/>
    <rect x="5" y="5" width="38" height="7" rx="2"/>
    <!-- Right pillar (shorter) -->
    <rect x="36" y="16" width="7" height="27" rx="2"/>
  </g>
  <!-- The AI agent node passing through the gate -->
  <circle cx="22" cy="26" r="4.4" fill="#00b874"/>
  <circle cx="22" cy="26" r="2" fill="#ffffff"/>
</svg>
